[project]
name = "grafana-mcp-vm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["ops>=3,<4"]

[dependency-groups]
lint = ["ruff"]
unit = ["ops[testing]", "pytest"]
integration = ["jubilant", "pytest"]
dev = ["jubilant", "ops[testing]", "pytest", "ruff", "tox", "tox-uv"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
