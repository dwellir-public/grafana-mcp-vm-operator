[tox]
no_package = True
min_version = 4.0
env_list = lint, unit

[testenv]
runner = uv-venv-lock-runner
set_env =
    PYTHONPATH = {tox_root}/src

[testenv:format]
dependency_groups = lint
commands =
    ruff check --fix src tests
    ruff format src tests

[testenv:lint]
dependency_groups = lint
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:unit]
dependency_groups = unit
commands = pytest -q tests/unit {posargs}

[testenv:integration]
dependency_groups = integration
pass_env = JUJU_TEST_MODEL
commands = pytest -v tests/integration {posargs}
